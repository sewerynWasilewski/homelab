http:
  routers:
    alertmanager-http:
      rule: "Host(`alertmanager.swasilewski.pl`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: alertmanager

    alertmanager-https:
      rule: "Host(`alertmanager.swasilewski.pl`)"
      entryPoints:
        - websecure
      middlewares:
        - alertmanager-auth
      service: alertmanager
      tls:
        certResolver: le

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
    # Alertmanager has no built-in login of its own - gate it with basic
    # auth. Users file lives only on the proxy VM (not in git), see
    # kubernetes/SECRETS.md.
    alertmanager-auth:
      basicAuth:
        usersFile: /auth/alertmanager.htpasswd

  services:
    alertmanager:
      loadBalancer:
        servers:
          - url: "http://10.10.10.82:30093"
          - url: "http://10.10.10.83:30093"
          - url: "http://10.10.10.84:30093"
