# Local socket connections inside container
local   all             all                         peer

# Local TCP connections (loopback)
host    all             all     127.0.0.1/32        scram-sha-256
host    all             all     ::1/128             scram-sha-256

# Allow connections coming from Docker bridge network
# (client appears as bridge IP, not 127.0.0.1)
host    tfstate         tfstate_user 172.30.0.0/24  scram-sha-256

# Remote terraform runs (e.g. via SSH tunnel through the LAN), matching the
# alerta/goalert rules below.
host    tfstate         tfstate_user 10.10.10.0/24  scram-sha-256

# Alerta, running as a pod in the k8s cluster.
# Scoped to one database/user, not "all" - create both before this takes effect.
host    alerta          alerta_user  10.10.10.0/24  scram-sha-256

# GoAlert, running as a pod in the k8s cluster.
host    goalert         goalert_user 10.10.10.0/24  scram-sha-256

# Grafana Alloy's postgres exporter, running natively on this same VM -
# connects via the published port (10.10.10.10:5432), so it appears to
# Postgres as a Docker bridge IP, same as tfstate_user above.
host    postgres        monitoring_exporter 172.30.0.0/24  scram-sha-256

# Same hairpin-NAT case as tfstate_user above - a same-host connection to the
# published port keeps the VM's own LAN IP as source, not a bridge IP.
host    postgres        monitoring_exporter 10.10.10.0/24  scram-sha-256
