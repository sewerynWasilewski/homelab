services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to the VM's LAN IP (not 0.0.0.0) so it's reachable from the k8s
      # cluster subnet for Grafana OnCall's engine - restrict further via the
      # host firewall to just that subnet, and see pg_hba.conf for the
      # per-database/user access rule.
      - "10.10.10.10:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet

networks:
  pgnet:
    driver: bridge
    ipam:
      config:
        # Define a fixed subnet to avoid unpredictable Docker-assigned ranges
        - subnet: 172.30.0.0/24

volumes:
  pg_data:
