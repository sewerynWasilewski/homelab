replicaCount: 1

image:
  repository: goalert/goalert
  tag: "v0.34.1"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8081
  nodePort: 30161

# GoAlert validates the request's Referer against this URL, so it must
# match however you're actually reaching it.
publicUrl: https://goalert.swasilewski.pl

database:
  existingSecret: goalert-database
  secretKey: DATABASE_URL

encryptionKey:
  existingSecret: goalert-encryption-key
  secretKey: DATA_ENCRYPTION_KEY

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
