replicaCount: 1

image:
  repository: prom/alertmanager
  tag: v0.27.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 9093
  nodePort: 30093

storage:
  size: 500Mi
  storageClassName: local-path

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

alerta:
  webhookUrl: http://alerta-alerta.monitoring.svc.cluster.local:8080/api/webhooks/prometheus
  # Secret created by hand from .env - see kubernetes/SECRETS.md.
  existingSecret: alertmanager-alerta-key

goalert:
  # The integration URL embeds a token, so it lives in a Secret applied
  # separately (see kubernetes/SECRETS.md) and is read via
  # url_file. Set to "" to skip wiring GoAlert in at all.
  existingSecret: alertmanager-goalert-webhook
