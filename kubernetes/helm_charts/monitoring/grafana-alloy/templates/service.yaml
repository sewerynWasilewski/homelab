apiVersion: v1
kind: Service
metadata:
  name: {{ include "grafana-alloy.fullname" . }}
  labels:
    {{- include "grafana-alloy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.uiService.type }}
  selector:
    {{- include "grafana-alloy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.uiService.port }}
      targetPort: http
      {{- if eq .Values.uiService.type "NodePort" }}
      nodePort: {{ .Values.uiService.nodePort }}
      {{- end }}
