apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "grafana-alloy.fullname" . }}
  labels:
    {{- include "grafana-alloy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "grafana-alloy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana-alloy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "grafana-alloy.fullname" . }}
      hostPID: true
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: alloy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--storage.path=/var/lib/alloy/data"
          env:
            # This node's IP, for scraping its own kubelet directly.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # The real node name, so host-metric series show up labeled by
            # node instead of by this Alloy pod's own name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MIMIR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alloy-mimir-credentials
                  key: MIMIR_PASSWORD
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "grafana-alloy.fullname" . }}-config
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
