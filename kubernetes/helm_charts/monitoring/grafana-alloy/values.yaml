image:
  repository: grafana/alloy
  tag: "v1.19.2"
  pullPolicy: IfNotPresent

# Alloy's own UI (component graph, live target health) - useful for debugging.
uiService:
  type: NodePort
  port: 12345
  nodePort: 30345

# Mimir is the only metrics store (Prometheus was removed from the cluster).
# Goes through the public domain (not the in-cluster Service) even for this
# in-cluster writer, on purpose - every writer authenticates the same way,
# per-tenant, so a compromised/retired one can be revoked without touching
# the others. Password comes from a Secret, see kubernetes/SECRETS.md.
mimirRemoteWriteUrl: https://mimir.swasilewski.pl/api/v1/push
mimirTenant: homelab

clusterLabel: homelab

# Cluster-wide target, scraped by exactly one Alloy pod thanks to clustering.
kubeStateMetricsAddress: kube-state-metrics-kube-state-metrics.monitoring.svc.cluster.local:8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

tolerations:
  # Run on the control-plane node too, not just workers.
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
