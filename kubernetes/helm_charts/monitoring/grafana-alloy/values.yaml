image:
  repository: grafana/alloy
  tag: "v1.19.2"
  pullPolicy: IfNotPresent

# Alloy's own UI (component graph, live target health) - useful for debugging.
uiService:
  type: NodePort
  port: 12345
  nodePort: 30345

remoteWriteUrl: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write

# Dual-write (POC, deliberate): Prometheus keeps evaluating alert rules
# independently so alerting survives a Mimir outage; Mimir is the long-term
# store Grafana actually queries from. See docs/mimir.md.
# Goes through the public domain (not the in-cluster Service) even for this
# in-cluster writer, on purpose - every writer authenticates the same way,
# per-tenant, so a compromised/retired one can be revoked without touching
# the others. Password comes from secret-mimir.yaml, not this file.
mimirRemoteWriteUrl: https://mimir.swasilewski.pl/api/v1/push
mimirTenant: homelab

clusterLabel: homelab

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

tolerations:
  # Run on the control-plane node too, not just workers.
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
