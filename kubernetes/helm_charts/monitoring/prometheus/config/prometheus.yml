global:
  scrape_interval: {{ .Values.prometheus.scrapeInterval }}
  evaluation_interval: {{ .Values.prometheus.evaluationInterval }}

rule_files:
  - /etc/prometheus/rules/prometheus-alerts.yml
  - /etc/prometheus/rules/kubernetes-alerts.yml
  - /etc/prometheus/rules/node-alerts.yml
  - /etc/prometheus/rules/container-alerts.yml
  - /etc/prometheus/rules/probe-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - {{ .Values.targets.alertmanager }}

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    relabel_configs:
      - target_label: cluster
        replacement: {{ .Values.clusterLabel }}

  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - {{ .Values.targets.kubeStateMetrics }}
    relabel_configs:
      - target_label: cluster
        replacement: {{ .Values.clusterLabel }}
      # Same k8s_cluster label the Alloy DaemonSet sets on node-level
      # metrics - kube-state-metrics is the cluster-object-level equivalent
      # (pods, deployments, services), so it gets tagged the same way.
      - target_label: k8s_cluster
        replacement: {{ .Values.clusterLabel }}
