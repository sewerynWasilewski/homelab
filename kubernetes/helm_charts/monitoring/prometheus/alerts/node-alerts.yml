groups:
  - name: node
    rules:
      - alert: NodeMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} memory usage above 90%"
          description: "Available memory has been below 10% for more than 10 minutes."

      - alert: NodeCPUHigh
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} CPU usage above 90%"
          description: "Average CPU usage has been above 90% for more than 10 minutes."

      - alert: NodeDiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} filesystem {{ $labels.mountpoint }} above 85% full"
          description: "Less than 15% free space has remained for more than 15 minutes."
