apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # One Grafana Organization = one Mimir tenant. This org (id 1) is the
      # "homelab" tenant - its X-Scope-OrgID header here must match a real
      # basicAuth user in docker/lb/dynamic/mimir.yml, or writes/reads for
      # this tenant stop working. A second client gets its own Grafana Org,
      # its own copy of this datasource (different orgId + X-Scope-OrgID),
      # and its own Traefik credential - nothing else changes.
      - name: Mimir
        type: prometheus
        uid: mimir
        orgId: 1
        url: {{ .Values.targets.mimir }}
        access: proxy
        isDefault: true
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "homelab"
      - name: Prometheus
        type: prometheus
        uid: prometheus
        orgId: 1
        url: {{ .Values.targets.prometheus }}
        access: proxy
        isDefault: false
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        orgId: 1
        url: {{ .Values.targets.alertmanager }}
        access: proxy
        jsonData:
          implementation: prometheus
