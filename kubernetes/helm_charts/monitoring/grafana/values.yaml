replicaCount: 1

image:
  repository: grafana/grafana
  tag: "11.2.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 3000
  nodePort: 30030

admin:
  # Admin credentials come from a Secret applied separately (kept out of git
  # so ArgoCD can sync this chart) - see kubernetes/SECRETS.md. Must hold
  # GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD.
  existingSecret: grafana-admin-credentials

rootUrl: https://grafana.swasilewski.pl/

persistence:
  size: 1Gi
  storageClassName: local-path

targets:
  mimir: http://mimir-mimir.monitoring.svc.cluster.local:8080/prometheus
  alertmanager: http://alertmanager-alertmanager.monitoring.svc.cluster.local:9093

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
