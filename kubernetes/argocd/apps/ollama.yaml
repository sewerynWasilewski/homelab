apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://otwld.github.io/ollama-helm/
    chart: ollama
    targetRevision: 1.96.0
    helm:
      valuesObject:
        ollama:
          models:
            pull: [qwen3.5:9b, qwen3.5:4b]
            clean: false
        persistentVolume:
          enabled: true
          size: 50Gi
          storageClass: local-path
        resources:
          requests: { cpu: "6", memory: 8Gi }
          limits:   { memory: 10Gi }
        extraEnv:
          - name: OLLAMA_CONTEXT_LENGTH
            value: "16384"
        nodeSelector: 
          swasilewski.pl/nodepool: ai
        tolerations:
            - key: swasilewski.pl/nodepool
              operator: Equal
              value: ai
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]