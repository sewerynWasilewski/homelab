apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerta
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sewerynWasilewski/homelab.git
    targetRevision: main
    path: kubernetes/helm_charts/monitoring/alerta
    helm:
      releaseName: alerta
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
