- name: Ensure kubeconfig directory exists
  file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy admin.conf to root kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Copy Flannel manifest
  copy:
    src: kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: "0644"

- name: Apply Flannel manifest
  command: kubectl apply -f /tmp/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for Flannel pods to become ready
  command: kubectl -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf