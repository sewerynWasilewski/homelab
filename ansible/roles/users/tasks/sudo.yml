---
- name: Update apt cache on Debian family
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian" and not users_skip_apt_cache

- name: Ensure sudo package is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Ensure sudo group exists
  ansible.builtin.group:
    name: sudo
    state: present
    system: true