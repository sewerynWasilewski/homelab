- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Configure kubelet node IP
  ansible.builtin.copy:
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}\n"
    dest: /etc/default/kubelet
  when: not kubelet_conf.stat.exists

- name: Get worker join command from control plane
  ansible.builtin.command: >
    kubeadm token create
    --kubeconfig /etc/kubernetes/super-admin.conf
    --ttl 1h
    --print-join-command
  register: kubeadm_worker_join_cmd
  changed_when: false
  delegate_to: "{{ groups['control_plane'][0] }}"
  when: not kubelet_conf.stat.exists

- name: Join node to cluster
  ansible.builtin.command: >
    {{ kubeadm_worker_join_cmd.stdout }}
    --cri-socket unix:///run/containerd/containerd.sock
  when: not kubelet_conf.stat.exists
