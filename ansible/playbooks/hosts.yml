- name: Manage Kubernetes internal host resolution
  hosts: k8s
  become: true
  gather_facts: false

  vars:
    control_plane_endpoint_host: "{{ control_plane_endpoint.split(':')[0] }}"

  tasks:
    - name: Determine bootstrap control plane host
      ansible.builtin.set_fact:
        bootstrap_control_plane_host: "{{ item }}"
      loop: "{{ groups['k8s'] }}"
      when:
        - hostvars[item].k8s_control_plane_bootstrap | default(false) | bool

    - name: Ensure bootstrap control plane host was found
      ansible.builtin.assert:
        that:
          - bootstrap_control_plane_host is defined
        fail_msg: >
          No host in group 'k8s' has k8s_control_plane_bootstrap=true.
          This is required to map control_plane_endpoint to the primary control plane private IP.

    - name: Ensure Kubernetes host entries are present in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED K8S HOSTS"
        create: true
        block: |
          # Internal name resolution for Kubernetes nodes.
          #
          # This block ensures that Kubernetes nodes resolve each other using
          # private/internal addresses. The controlPlaneEndpoint hostname is also
          # mapped to the bootstrap control plane internal IP so kubeadm init/join
          # does not try to reach the API through the public Internet path.
          #
          {% for host in groups['k8s'] %}
          {% set raw_ip = hostvars[host].private_ip | default(hostvars[host].ansible_host) %}
          {% set host_ip = (raw_ip[0] if raw_ip is sequence and raw_ip is not string else raw_ip) %}
          {{ host_ip }} {{ host }}{% if host == bootstrap_control_plane_host %} {{ control_plane_endpoint.split(':')[0] }}{% endif %}{{''}}
          {% endfor %}